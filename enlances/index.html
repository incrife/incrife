  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #6f0000;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 5vw, 32px) clamp(16px, 5vw, 24px) clamp(30px, 8vh, 50px);
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo con blur animado */
    .bg-blur-artist {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      z-index: 0;
      background-image: url('https://raw.githubusercontent.com/incrife/incrife/main/Dise%C3%B1o%20sin%20t%C3%ADtulo%20(57).png');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      filter: blur(28px) brightness(0.55) saturate(1.6);
      transform: scale(1.05);
      animation: slowPan 24s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes slowPan {
      0% { transform: scale(1.05) translateX(0%) translateY(0%); filter: blur(28px) brightness(0.55) saturate(1.6);}
      100% { transform: scale(1.12) translateX(3%) translateY(2%); filter: blur(32px) brightness(0.5) saturate(1.8);}
    }
    
    .overlay-red {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(180,0,0,0.45), rgba(70,0,0,0.7));
      z-index: 1;
      pointer-events: none;
    }
    
    .dynamic-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(115deg, rgba(255,70,40,0.08) 0px, rgba(255,70,40,0.08) 2px, transparent 2px, transparent 12px);
      animation: driftLines 15s linear infinite;
    }
    
    @keyframes driftLines {
      0% { background-position: 0 0; }
      100% { background-position: 80px 80px; }
    }
    
    .glow-pulse {
      position: fixed;
      bottom: 10%;
      right: 5%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255,80,40,0.25) 0%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(45px);
      z-index: 1;
      animation: softPulse 6s infinite alternate;
      pointer-events: none;
    }
    
    @keyframes softPulse {
      0% { opacity: 0.4; transform: scale(0.9);}
      100% { opacity: 0.9; transform: scale(1.2);}
    }
    
    .hub {
      width: 100%;
      max-width: min(580px, 95%);
      position: relative;
      z-index: 15;
    }

    .header {
      text-align: center;
      margin-bottom: clamp(24px, 6vh, 38px);
    }

    .avatar {
      width: clamp(105px, 24vw, 135px);
      height: clamp(105px, 24vw, 135px);
      margin: 0 auto clamp(12px, 3vh, 18px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255,110,70,0.95);
      box-shadow: 0 0 35px rgba(255,60,30,0.8), 0 0 15px rgba(255,100,0,0.6);
      transition: all 0.3s ease;
      background: #0a0a0a;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .avatar:hover {
      box-shadow: 0 0 70px rgba(255,80,40,1);
      transform: scale(1.02);
    }
    .avatar:hover img { transform: scale(1.03); }

    h1 {
      font-size: clamp(2rem, 9vw, 2.9rem);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
      text-shadow: 0 0 22px rgba(255,70,40,0.9);
      background: linear-gradient(135deg, #fff2e0, #ffc8aa, #ff9f6e);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-family: 'Montserrat', sans-serif;
    }

    .badge-art {
      color: #ffddcc;
      font-size: clamp(0.6rem, 3.2vw, 0.7rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      display: inline-block;
      padding: 0.25rem 1.2rem;
      border-radius: 50px;
      border: 0.5px solid rgba(255,120,80,0.6);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.5vh, 16px);
      margin-bottom: clamp(28px, 7vh, 36px);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(20,8,6,0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,100,70,0.6);
      border-radius: 70px;
      padding: clamp(10px, 2.5vw, 14px) clamp(20px, 4vw, 28px);
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: clamp(0.8rem, 3.5vw, 0.95rem);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: clamp(12px, 3.5vw, 18px);
    }

    .link-left i, .link-left .custom-icon {
      font-size: clamp(1.1rem, 4.5vw, 1.4rem);
      width: clamp(28px, 6vw, 34px);
      text-align: center;
    }
    
    /* Icono personalizado TIDAL */
    .custom-tidal-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(28px, 6vw, 34px);
    }
    .custom-tidal-icon svg {
      width: clamp(20px, 4vw, 26px);
      height: auto;
      fill: #00ffff;
    }

    .arrow {
      font-size: 0.8rem;
      color: #ffaa80;
      transition: transform 0.2s;
    }
    .link-btn:hover .arrow { transform: translateX(6px); color: white; }

    .link-btn:hover {
      background: rgba(50,20,12,0.9);
      border-color: #ffaa77;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 20px rgba(255,80,50,0.5);
    }

    /* Colores específicos */
    .spotify i { color: #1DB954; }
    .apple i { color: #fc6bcb; }
    .deezer i { color: #A238FF; }
    .amazon i { color: #ff9900; }
    .youtube-music i { color: #FF0000; }
    .tidal-link .custom-tidal-icon svg { fill: #00ffff; transition: filter 0.3s; }
    .tidal-link:hover .custom-tidal-icon svg { filter: drop-shadow(0 0 6px #00ffff); }
    
    /* Botón página oficial centrado en medio */
    .official-btn {
      background: #bc2f00;
      border: none;
      box-shadow: 0 0 28px rgba(255,80,30,0.8);
      justify-content: center;
    }
    .official-btn .link-left {
      flex: 1;
      justify-content: center;
    }
    .official-btn .arrow {
      display: none;
    }
    .official-btn:hover { background: #e64916; box-shadow: 0 0 45px rgba(255,100,40,0.9);}

    /* Social dock */
    .social-dock {
      display: flex;
      justify-content: center;
      gap: clamp(28px, 8vw, 42px);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,100,75,0.6);
      border-radius: 100px;
      padding: clamp(8px, 2vh, 12px) clamp(24px, 6vw, 40px);
      width: fit-content;
      margin: 0 auto clamp(22px, 5vh, 30px);
    }
    
    .social-icon {
      color: #ffccb0 !important;
      font-size: clamp(1.2rem, 5vw, 1.5rem);
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .social-icon:hover {
      transform: translateY(-5px) scale(1.12);
      color: #ffffff !important;
      text-shadow: 0 0 12px rgba(255,100,50,1);
    }
    
    /* Footer simplificado: solo derechos */
    .footer-bottom {
      text-align: center;
      font-size: 0.65rem;
      color: #ffbf9a;
      opacity: 0.7;
      padding-top: 8px;
    }

    /* Animación entrada suave sin splash */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(15px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    .animate-item { animation: fadeUp 0.5s ease forwards; opacity: 0; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.1s; }
    .d3 { animation-delay: 0.15s; }
    .d4 { animation-delay: 0.2s; }
    .d5 { animation-delay: 0.25s; }
    .d6 { animation-delay: 0.3s; }
    .d7 { animation-delay: 0.35s; }
    .d8 { animation-delay: 0.4s; }

    @media (max-width: 480px) {
      .social-dock { gap: 24px; padding: 8px 22px; }
      .link-left { gap: 8px; }
    }
  </style>
</head>
<body>

<!-- Fondo premium con blur -->
<div class="bg-blur-artist"></div>
<div class="overlay-red"></div>
<div class="dynamic-lines"></div>

<div class="hub">

  <div class="header animate-item d1">

          </svg>

    <!-- PÁGINA OFICIAL centrada (sin flecha, texto centrado) -->

      <div class="link-left"><i class="fa-solid fa-globe"></i><span>Página oficial</span></div>
    </a>
  </div>

  <!-- SOCIAL DOCK: X, TikTok, IG, Facebook -->
  <div class="social-dock animate-item d5">
    <a href="https://x.com/Incrife" class="social-icon" target="_blank" rel="noopener" aria-label="X">
      <i class="fa-brands fa-twitter"></i>
    </a>
    <a href="https://www.tiktok.com/@incrife" class="social-icon" target="_blank" rel="noopener" aria-label="TikTok">
      <i class="fa-brands fa-tiktok"></i>

    <a href="https://www.instagram.com/incrife/" class="social-icon" target="_blank" rel="noopener" aria-label="Instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <a href="https://www.facebook.com/incrifeoficial" class="social-icon" target="_blank" rel="noopener" aria-label="Facebook">
      <i class="fa-brands fa-facebook-f"></i>
    </a>
  </div>

  <!-- FOOTER: Solo derechos reservados (sin email ni teléfono) -->
  <div class="footer-bottom animate-item d6">
    <div class="copyright">© 2026 INCRIFE · Todos los derechos reservados</div>
  </div>
</div>

<script>
  // ========== SCHEMA.ORG MEJORADO PARA GOOGLE (MusicGroup, Person, ItemList) ==========
  
  // Schema principal: MusicGroup con enlaces a cada plataforma
  const musicGroupSchema = {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "INCRIFE",
    "alternateName": "Incrife Musica",
    "description": "Artista urbano y productor musical. Distribución oficial en todas las plataformas de streaming: Spotify, Apple Music, Deezer, Amazon Music, YouTube Music y TIDAL.",
    "url": "https://incrife.com",
    "image": "https://raw.githubusercontent.com/incrife/incrife/main/Dise%C3%B1o%20sin%20t%C3%ADtulo%20(57).png",
    "genre": ["Urban", "Latin Trap", "Hip Hop", "Reggaeton"],
    "sameAs": [
      "https://open.spotify.com/intl-es/artist/42euHjlNEF6gE3zuWrAJBi",
      "https://music.apple.com/es/artist/incrife/1848003000",
      "https://www.deezer.com/en/artist/352025722",
      "https://music.amazon.in/artists/B0FX5XCGKP",
      "https://music.youtube.com/@incrife",
      "https://tidal.com/artist/68789425",
      "https://x.com/Incrife",
      "https://www.instagram.com/incrife/",
      "https://www.tiktok.com/@incrife",
      "https://www.facebook.com/incrifeoficial"
    ],
    "email": "contact@incrife.com",
    "telephone": "+34624170204",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Barcelona",
      "addressCountry": "ES"
    }
  };
  
  // Schema de Person para autoría
  const personSchema = {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "INCRIFE",
    "jobTitle": "Artista musical · Productor",
    "url": "https://incrife.com",
    "sameAs": musicGroupSchema.sameAs,
    "image": musicGroupSchema.image
  };
  
  // Schema ItemList para los enlaces de streaming (ayuda a Google a entender la lista)
  const itemListSchema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Plataformas de streaming oficiales de INCRIFE",
    "description": "Lista de enlaces para escuchar la música de INCRIFE en todas las plataformas digitales.",
    "numberOfItems": 6,
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Spotify", "url": "https://open.spotify.com/intl-es/artist/42euHjlNEF6gE3zuWrAJBi" },
      { "@type": "ListItem", "position": 2, "name": "Apple Music", "url": "https://music.apple.com/es/artist/incrife/1848003000" },
      { "@type": "ListItem", "position": 3, "name": "Deezer", "url": "https://www.deezer.com/en/artist/352025722" },
      { "@type": "ListItem", "position": 4, "name": "Amazon Music", "url": "https://music.amazon.in/artists/B0FX5XCGKP" },
      { "@type": "ListItem", "position": 5, "name": "YouTube Music", "url": "https://music.youtube.com/@incrife" },
      { "@type": "ListItem", "position": 6, "name": "TIDAL", "url": "https://tidal.com/artist/68789425" }
    ]
  };
  
  // Schema WebSite
  const webSiteSchema = {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "INCRIFE · Distribución musical oficial",
    "url": "https://incrife.com/enlances",
    "description": "Página de enlaces oficiales del artista INCRIFE para streaming musical."
  };
  
  // Insertar schemas en el head
  const scriptMusic = document.createElement('script');
  scriptMusic.type = 'application/ld+json';
  scriptMusic.textContent = JSON.stringify(musicGroupSchema);
  
  const scriptPerson = document.createElement('script');
  scriptPerson.type = 'application/ld+json';
  scriptPerson.textContent = JSON.stringify(personSchema);
  
  const scriptList = document.createElement('script');
  scriptList.type = 'application/ld+json';
  scriptList.textContent = JSON.stringify(itemListSchema);
  
  const scriptWeb = document.createElement('script');
  scriptWeb.type = 'application/ld+json';
  scriptWeb.textContent = JSON.stringify(webSiteSchema);
  
  document.head.appendChild(scriptMusic);
  document.head.appendChild(scriptPerson);
  document.head.appendChild(scriptList);
  document.head.appendChild(scriptWeb);
  
  // Efecto hover adicional
  document.querySelectorAll('.link-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      btn.style.transition = 'all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2)';
    });
  });
</script>
