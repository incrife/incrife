/* ==========================
   PRELOADER
========================== */
#preloader {
    position: fixed;
    inset: 0;
    z-index: 999999999;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, .95);
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
    transition: opacity .65s, visibility .65s;
}

#preloader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.glass-loader {
    width: 260px;
    height: 180px;
    border-radius: 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
    border: 1px solid rgba(255, 255, 255, .18);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 25px 70px rgba(0, 0, 0, .22);
    overflow: hidden;
    position: relative;
}

.glass-loader::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 220px;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .22), transparent);
    transform: translateX(-340px);
    animation: shine 3s infinite;
}

.glass-loader h1 {
    margin: 0;
    color: #fff;
    font-size: 44px;
    letter-spacing: 10px;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    animation: breathing 2.5s infinite ease-in-out;
}

.glass-loader span {
    margin-top: 10px;
    color: rgba(255, 255, 255, .70);
    letter-spacing: 6px;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 500;
}

@keyframes breathing {
    0% { opacity: .55; transform: scale(.98); }
    50% { opacity: 1; transform: scale(1.03); text-shadow: 0 0 16px rgba(255, 255, 255, .35); }
    100% { opacity: .55; transform: scale(.98); }
}

@keyframes shine {
    to { transform: translateX(340px); }
}
