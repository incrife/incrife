    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --dark: #0A0A0A;
            --darker: #050505;
            --gray-900: #111111;
            --gray-800: #222222;
            --gray-700: #333333;
            --gray-600: #444444;
            --gray-500: #666666;
            --white: #FFFFFF;
            
            --red-glitch: #FF2A2A;
            --red-dark: #CC0000;
            --red-light: #FF5555;
            --cyan: #00FFFF;
            --magenta: #FF00FF;
            --orange: #FF6B35;
            
            --font-primary: 'Archivo', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html {
            scroll-behavior: smooth;
            background: var(--black);
        }

        body {
            font-family: var(--font-primary);
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        /* ===== GLITCH BACKGROUND EFFECTS ===== */
        .glitch-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .glitch-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red-glitch), transparent);
            animation: glitch-line 4s linear infinite;
            opacity: 0.3;
        }

        .glitch-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--cyan);
            border-radius: 50%;
            animation: glitch-dot 3s linear infinite;
            opacity: 0.2;
        }

        .glitch-scan {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(255, 42, 42, 0.05) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
            animation: scanline 8s linear infinite;
        }

        @keyframes glitch-line {
            0% { transform: translateX(-100%) translateY(var(--random-y, 0)); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateX(100%) translateY(var(--random-y, 0)); opacity: 0; }
        }

        @keyframes glitch-dot {
            0% { transform: translateY(-100px) scale(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(100vh) scale(1); opacity: 0; }
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ===== TYPOGRAPHY & GLITCH TEXT ===== */
        .glitch-text {
            position: relative;
            display: inline-block;
            color: var(--white);
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            left: 2px;
            color: var(--cyan);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            color: var(--magenta);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            5% { clip: rect(112px, 9999px, 76px, 0); }
            10% { clip: rect(85px, 9999px, 77px, 0); }
            15% { clip: rect(27px, 9999px, 97px, 0); }
            100% { clip: rect(79px, 9999px, 88px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(129px, 9999px, 36px, 0); }
            5% { clip: rect(36px, 9999px, 4px, 0); }
            10% { clip: rect(85px, 9999px, 4px, 0); }
            100% { clip: rect(138px, 9999px, 98px, 0); }
        }

        /* ===== NAVIGATION ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 42, 42, 0.2);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            position: relative;
        }

        .logo span {
            color: var(--red-glitch);
        }

        .logo::after {
            content: '//';
            color: var(--cyan);
            margin-left: 10px;
            font-weight: 300;
            opacity: 0.5;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-link {
            color: var(--white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            font-family: var(--font-mono);
        }

        .nav-link::before {
            content: '>';
            position: absolute;
            left: -15px;
            opacity: 0;
            transition: opacity 0.3s;
            color: var(--red-glitch);
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--red-glitch);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .mobile-menu-btn:hover {
            color: var(--red-glitch);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            position: relative;
            background: linear-gradient(45deg, var(--darker) 0%, var(--black) 100%);
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 42, 42, 0.1) 0%, transparent 70%);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 3;
        }

        .hero-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: var(--font-primary);
            font-size: 72px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .philosophy {
            font-family: var(--font-mono);
            font-size: 18px;
            color: var(--cyan);
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            border-left: 2px solid var(--red-glitch);
            padding-left: 20px;
            text-align: left;
        }

        .philosophy span {
            display: block;
            margin-bottom: 10px;
            color: var(--white);
        }

        .hero-tags {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 10px 20px;
            background: rgba(255, 42, 42, 0.1);
            border: 1px solid rgba(255, 42, 42, 0.3);
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--red-glitch);
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(255, 42, 42, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 42, 42, 0.2);
        }

        .social-hero {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .social-hero a {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 42, 42, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .social-hero a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 42, 42, 0.3), transparent);
            transition: left 0.5s;
        }

        .social-hero a:hover::before {
            left: 100%;
        }

        .social-hero a:hover {
            background: var(--red-glitch);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px rgba(255, 42, 42, 0.3);
        }

        /* ===== ABOUT SECTION ===== */
        .about {
            padding: 100px 0;
            background: var(--dark);
            position: relative;
            border-top: 1px solid rgba(255, 42, 42, 0.2);
        }

        .section-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-family: var(--font-primary);
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .accent {
            color: var(--red-glitch);
        }

        .section-subtitle {
            color: var(--cyan);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            font-family: var(--font-mono);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text {
            font-size: 18px;
            line-height: 1.8;
            color: #CCCCCC;
        }

        .about-text p {
            margin-bottom: 20px;
        }

        .about-text strong {
            color: var(--red-glitch);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-item {
            text-align: center;
            padding: 30px;
            background: rgba(255, 42, 42, 0.1);
            border: 1px solid rgba(255, 42, 42, 0.3);
            border-radius: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--red-glitch);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .stat-item:hover::before {
            transform: scaleX(1);
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 42, 42, 0.2);
        }

        .stat-number {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--red-glitch);
            font-family: var(--font-mono);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            font-family: var(--font-mono);
        }

        .about-visual {
            height: 400px;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.8) 0%, rgba(0, 0, 0, 0.9) 100%);
            border-radius: 20px;
            border: 1px solid rgba(255, 42, 42, 0.3);
            position: relative;
            overflow: hidden;
        }

        .about-visual::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 42, 42, 0.05) 10px,
                rgba(255, 42, 42, 0.05) 20px
            );
        }

        /* ===== MUSIC SECTION ===== */
        .music {
            padding: 100px 0;
            background: var(--darker);
            border-top: 1px solid rgba(255, 42, 42, 0.2);
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        .track-card {
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid transparent;
            position: relative;
        }

        .track-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--red-glitch), var(--cyan), var(--magenta), var(--red-glitch));
            border-radius: 17px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .track-card:hover::before {
            opacity: 1;
            animation: border-glow 2s linear infinite;
        }

        @keyframes border-glow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .track-card:hover {
            transform: translateY(-10px);
        }

        .track-visual {
            height: 200px;
            background: linear-gradient(135deg, var(--black) 0%, var(--gray-900) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .track-visual::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 42, 42, 0.1) 2px,
                rgba(255, 42, 42, 0.1) 4px
            );
            animation: scan 10s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .track-number {
            font-size: 64px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: var(--font-mono);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: var(--red-glitch);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid var(--white);
            z-index: 2;
        }

        .play-btn:hover {
            background: var(--white);
            color: var(--red-glitch);
            transform: scale(1.1);
        }

        .track-info {
            padding: 30px;
        }

        .track-title {
            font-size: 24px;
            margin-bottom: 10px;
            font-family: var(--font-primary);
            color: var(--white);
        }

        .track-meta {
            color: var(--cyan);
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .track-links {
            display: flex;
            gap: 10px;
        }

        .stream-link {
            flex: 1;
            padding: 12px;
            background: rgba(255, 42, 42, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 42, 42, 0.5);
            font-family: var(--font-mono);
        }

        .stream-link:hover {
            background: var(--red-glitch);
            transform: translateY(-2px);
        }

        /* ===== FILMS SECTION ===== */
        .films {
            padding: 100px 0;
            background: var(--dark);
            border-top: 1px solid rgba(255, 42, 42, 0.2);
        }

        .video-main {
            margin-bottom: 60px;
        }

        .video-container {
            height: 500px;
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 42, 42, 0.3);
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 50px,
                rgba(255, 42, 42, 0.1) 50px,
                rgba(255, 42, 42, 0.1) 100px
            );
            animation: glitch-bg 20s linear infinite;
        }

        @keyframes glitch-bg {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        .video-overlay {
            text-align: center;
            color: var(--white);
            z-index: 2;
        }

        .video-overlay i {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--red-glitch);
        }

        .video-overlay h3 {
            font-size: 32px;
            margin-bottom: 10px;
            font-family: var(--font-primary);
        }

        .video-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .video-thumb {
            height: 200px;
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.1) 0%, rgba(0, 0, 0, 0.6) 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 18px;
            border: 1px solid rgba(255, 42, 42, 0.3);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            font-family: var(--font-mono);
        }

        .video-thumb::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 42, 42, 0.3), transparent);
            transition: left 0.5s;
        }

        .video-thumb:hover::before {
            left: 100%;
        }

        .video-thumb:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateY(-5px);
        }

        /* ===== EVENTS SECTION ===== */
        .events {
            padding: 100px 0;
            background: var(--darker);
            border-top: 1px solid rgba(255, 42, 42, 0.2);
        }

        .events-timeline {
            max-width: 800px;
            margin: 60px auto 0;
        }

        .event-card {
            display: grid;
            grid-template-columns: 100px 1fr 150px;
            gap: 30px;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.1) 0%, rgba(0, 0, 0, 0.6) 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 42, 42, 0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--red-glitch);
        }

        .event-card:hover {
            transform: translateX(10px);
            border-color: var(--cyan);
            box-shadow: 0 10px 30px rgba(255, 42, 42, 0.2);
        }

        .event-date {
            text-align: center;
        }

        .date-day {
            font-size: 32px;
            font-weight: 700;
            color: var(--red-glitch);
            display: block;
            font-family: var(--font-mono);
        }

        .date-month {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            font-family: var(--font-mono);
        }

        .event-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: var(--font-primary);
        }

        .event-location {
            color: var(--cyan);
            font-size: 14px;
            font-family: var(--font-mono);
        }

        .event-location i {
            margin-right: 8px;
        }

        .ticket-btn {
            padding: 12px 24px;
            background: var(--red-glitch);
            color: var(--white);
            border: none;
            border-radius: 8px;
