    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --dark: #0A0A0A;
            --darker: #050505;
            --gray: #1A1A1A;
            --light-gray: #2A2A2A;
            --white: #FFFFFF;
            --red: #FF003C;
            --red-dark: #CC0030;
            --red-light: #FF335C;
            --neon-blue: #00F3FF;
            --neon-pink: #FF00FF;
            --glitch-cyan: #00FFFF;
            --glitch-magenta: #FF00FF;
            --tekno-purple: #8A2BE2;
            
            --font-title: 'Oxanium', sans-serif;
            --font-body: 'Red Hat Display', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --tekno-gradient: linear-gradient(45deg, var(--red), var(--tekno-purple), var(--neon-blue));
            --hell-gradient: linear-gradient(135deg, var(--red-dark), #8B0000, #4A0000);
        }

        html {
            scroll-behavior: smooth;
            background: var(--black);
        }

        body {
            font-family: var(--font-body);
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* ===== HELL GLITCH BACKGROUND ===== */
        .hell-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
        }

        .hell-crack {
            position: absolute;
            background: var(--hell-gradient);
            filter: blur(20px);
            animation: hell-pulse 8s infinite alternate;
        }

        @keyframes hell-pulse {
            0% { opacity: 0.05; }
            100% { opacity: 0.15; }
        }

        /* ===== GLITCH EFFECTS ===== */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 0, 60, 0.03) 2px,
                    rgba(255, 0, 60, 0.03) 4px
                );
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
            animation: scanline 10s linear infinite;
        }

        .glitch-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)"/></svg>');
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: glitch-flicker 0.3s infinite;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        @keyframes glitch-flicker {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.1; }
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 var(--glitch-cyan);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: 2px 0 var(--glitch-magenta);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        /* ===== NAVIGATION ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            position: relative;
        }

        .logo span {
            background: var(--tekno-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--tekno-gradient);
            animation: logo-glow 3s infinite alternate;
        }

        @keyframes logo-glow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-link {
            color: var(--white);
            text-decoration: none;
            font-family: var(--font-title);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            padding: 5px 0;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--tekno-gradient);
            transition: width 0.3s;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            width: 100%;
        }

        .nav-link:hover {
            color: var(--red);
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .mobile-menu-btn:hover {
            color: var(--red);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--darker) 0%, var(--black) 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 60, 0.1) 0%, transparent 70%);
            animation: tekno-pulse 4s ease-in-out infinite;
        }

        @keyframes tekno-pulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 4;
            text-align: center;
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: 84px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .hero-subtitle {
            font-size: 24px;
            color: var(--red);
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .philosophy {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 0, 60, 0.1);
            border-left: 4px solid var(--red);
            position: relative;
            overflow: hidden;
        }

        .philosophy::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 0, 60, 0.05) 10px,
                rgba(255, 0, 60, 0.05) 20px
            );
        }

        .philosophy-text {
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.8;
            color: var(--white);
            position: relative;
            z-index: 1;
        }

        .philosophy-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            font-size: 24px;
        }

        .social-hero {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .social-hero a {
            width: 60px;
            height: 60px;
            background: rgba(255, 0, 60, 0.1);
            border: 2px solid var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 24px;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .social-hero a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.3), transparent);
            transition: left 0.5s;
        }

        .social-hero a:hover::before {
            left: 100%;
        }

        .social-hero a:hover {
            background: var(--red);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.5);
        }

        /* ===== ABOUT SECTION ===== */
        .about {
            padding: 100px 0;
            background: var(--dark);
            position: relative;
            border-top: 1px solid rgba(255, 0, 60, 0.3);
            border-bottom: 1px solid rgba(255, 0, 60, 0.3);
        }

        .section-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-family: var(--font-title);
            font-size: 48px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--tekno-gradient);
        }

        .accent {
            background: var(--tekno-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            color: var(--red);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text {
            font-size: 18px;
            line-height: 1.8;
            color: #CCCCCC;
        }

        .about-text p {
            margin-bottom: 20px;
            position: relative;
            padding-left: 20px;
            border-left: 2px solid var(--red);
        }

        .roles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .role-card {
            text-align: center;
            padding: 30px;
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--red);
            border-radius: 10px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--tekno-gradient);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .role-card:hover::before {
            transform: scaleX(1);
        }

        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
        }

        .role-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--red);
        }

        .role-title {
            font-family: var(--font-title);
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--white);
        }

        /* ===== PROJECTS SECTION ===== */
        .projects {
            padding: 100px 0;
            background: var(--darker);
            position: relative;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        .project-card {
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.1) 0%, rgba(0, 0, 0, 0.7) 100%);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid transparent;
            position: relative;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--tekno-gradient);
            border-radius: 17px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .project-card:hover::before {
            opacity: 1;
            animation: border-glow 2s linear infinite;
        }

        @keyframes border-glow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--red);
        }

        .project-visual {
            height: 200px;
            background: linear-gradient(135deg, var(--black) 0%, var(--red-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .project-visual::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 60, 0.1) 2px,
                rgba(255, 0, 60, 0.1) 4px
            );
            animation: scan 10s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .project-number {
            font-size: 72px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: var(--font-title);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid var(--white);
            z-index: 2;
        }

        .play-btn:hover {
            background: var(--white);
            color: var(--red);
            transform: scale(1.1);
        }

        .project-info {
            padding: 30px;
        }

        .project-title {
            font-size: 24px;
            margin-bottom: 10px;
            font-family: var(--font-title);
            color: var(--white);
        }

        .project-meta {
            color: var(--red);
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .project-links {
            display: flex;
            gap: 10px;
        }

        .stream-link {
            flex: 1;
            padding: 12px;
            background: rgba(255, 0, 60, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 0, 60, 0.5);
        }

        .stream-link:hover {
            background: var(--red);
            transform: translateY(-2px);
        }

        /* ===== VISUALS SECTION ===== */
        .visuals {
            padding: 100px 0;
            background: var(--dark);
            border-top: 1px solid rgba(255, 0, 60, 0.3);
            border-bottom: 1px solid rgba(255, 0, 60, 0.3);
        }

        .visual-main {
            margin-bottom: 60px;
        }

        .visual-container {
            height: 500px;
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.1) 0%, rgba(0, 0, 0, 0.7) 100%);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--red);
        }

        .visual-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 50px,
                rgba(255, 0, 60, 0.1) 50px,
                rgba(255, 0, 60, 0.1) 100px
            );
            animation: tekno-slide 20s linear infinite;
        }

        @keyframes tekno-slide {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        .visual-overlay {
            text-align: center;
            color: var(--white);
            z-index: 2;
        }

        .visual-overlay i {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--red);
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.5);
        }

        .visual-overlay h3 {
            font-size: 32px;
            margin-bottom: 10px;
            font-family: var(--font-title);
        }

        .visual-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .visual-thumb {
            height: 200px;
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 18px;
            border: 1px solid var(--red);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            font-family: var(--font-mono);
        }

        .visual-thumb::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 60, 0.3), transparent);
            transition: left 0.5s;
        }

        .visual-thumb:hover::before {
            left: 100%;
        }

        .visual-thumb:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            transform: translateY(-5px);
        }

        /* ===== EVENTS SECTION ===== */
        .events {
            padding: 100px 0;
            background: var(--darker);
        }

        .events-timeline {
            max-width: 800px;
            margin: 60px auto 0;
        }

        .event-card {
            display: grid;
            grid-template-columns: 100px 1fr 150px;
            gap: 30px;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--red);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--tekno-gradient);
        }

        .event-card:hover {
            transform: translateX(10px);
            border-color: var(--neon-pink);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
        }

        .event-date {
            text-align: center;
        }

        .date-day {
            font-size: 32px;
            font-weight: 700;
            color: var(--red);
            display: block;
            font-family: var(--font-title);
        }

        .date-month {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            font-family: var(--font-mono);
        }

        .event-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: var(--font-title);
        }

        .event-location {
            color: var(--red);
            font-size: 14px;
            font-family: var(--font-mono);
        }

        .event-location i {
            margin-right: 8px;
        }

        .ticket-btn {
            padding: 12px 24px;
            background: var(--red);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: var(--font-title);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ticket-btn:hover {
            background: var(--red-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 60, 0.5);
        }

        /* ===== CONTACT SECTION ===== */
        .contact {
            padding: 100px 0;
            background: var(--dark);
            border-top: 1px solid rgba(255, 0, 60, 0.3);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-top: 60px;
        }

        .contact-info h3 {
            font-size: 32px;
            margin-bottom: 30px;
            font-family: var(--font-title);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 0, 60, 0.1);
            border-radius: 15px;
            border: 1px solid var(--red);
            transition: all 0.3s;
        }

        .contact-item:hover {
            transform: translateX(5px);
            border-color: var(--neon-blue);
        }

        .contact-item i {
            width: 50px;
            height: 50px;
            background: var(--red);
            color: var(--white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .social-contact {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .social-contact a {
            width: 40px;
            height: 40px;
            background: rgba(255, 0, 60, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            text-decoration: none;
            transition: all 0.3s;
            border: 1px solid rgba(255, 0, 60, 0.5);
        }

        .social-contact a:hover {
            background: var(--red);
            color: var(--white);
            border-color: var(--red);
            transform: translateY(-3px);
        }

        /* ===== FORM STYLES ===== */
        .contact-form {
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--red);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--red);
            font-family: var(--font-mono);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--red);
            border-radius: 8px;
            color: var(--white);
            font-family: var(--font-body);
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--white);
            font-family: var(--font-body);
        }

        .form-radio-label input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--red);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .form-radio-label input[type="radio"]:checked {
            background: var(--red);
        }

        .form-radio-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            background: var(--white);
            border-radius: 50%;
        }

        .form-submit {
            width: 100%;
            padding: 16px;
            background: var(--red);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: var(--font-title);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .form-submit:hover {
            background: var(--red-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 0, 60, 0.5);
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 60px 0;
            background: var(--black);
            color: var(--white);
            border-top: 1px solid var(--red);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-logo {
            font-family: var(--font-title);
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .footer-logo span {
            background: var(--tekno-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-text {
            color: #CCCCCC;
            line-height: 1.6;
            font-size: 14px;
        }

            margin-bottom: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            font-family: var(--font-title);
        }
