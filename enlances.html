  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23cc0000'/><text x='50' y='67' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>I</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #8a0000;  /* fallback rojo intenso */
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 5vw, 32px) clamp(16px, 5vw, 24px) clamp(30px, 8vh, 50px);
      position: relative;
      overflow-x: hidden;
    }

    /* ========== FONDO ROJO CON ANIMACIÓN DE LLAMAS / ONDAS ROJAS PREMIUM ========== */
    .red-aura {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, #ff2a2a, #990000, #4a0000);
      animation: redPulseBg 8s infinite alternate;
    }
    
    @keyframes redPulseBg {
      0% {
        background: radial-gradient(circle at 20% 30%, #ff3a3a, #aa0000, #550000);
      }
      50% {
        background: radial-gradient(circle at 80% 70%, #ff4d4d, #cc0000, #660000);
      }
      100% {
        background: radial-gradient(circle at 40% 60%, #ff2a2a, #b30000, #3f0000);
      }
    }
    
    /* Llamas / textura de neón rojo moviéndose */
    .flame-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(45deg, rgba(255,80,40,0.15) 0px, rgba(255,80,40,0.15) 2px, transparent 2px, transparent 12px);
      animation: flameShift 14s linear infinite;
    }
    
    @keyframes flameShift {
      0% { background-position: 0 0; }
      100% { background-position: 100px 100px; }
    }
    
    /* Líneas dinámicas de energía roja */
    .energy-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .energy-lines span {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(255,100,50,0.5), transparent);
      height: 2px;
      width: 100%;
      animation: slideEnergy 9s linear infinite;
    }
    
    .energy-lines span:nth-child(1) { top: 12%; animation-delay: 0s; opacity: 0.7; background: linear-gradient(90deg, transparent, rgba(255,80,40,0.8), transparent);}
    .energy-lines span:nth-child(2) { top: 28%; animation-delay: -2s; opacity: 0.5; background: linear-gradient(90deg, transparent, rgba(255,120,60,0.6), transparent);}
    .energy-lines span:nth-child(3) { top: 45%; animation-delay: -4.5s; opacity: 0.8; background: linear-gradient(90deg, transparent, rgba(255,60,30,0.7), transparent);}
    .energy-lines span:nth-child(4) { top: 67%; animation-delay: -7s; opacity: 0.4; }
    .energy-lines span:nth-child(5) { top: 85%; animation-delay: -3s; opacity: 0.6; }
    
    @keyframes slideEnergy {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    /* Partículas / brillo rojo extra */
    .red-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255,100,50,0.12) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    
    /* Contenedor principal - RESPONSIVE */
    .hub {
      width: 100%;
      max-width: min(560px, 95%);
      position: relative;
      z-index: 10;
    }

    /* Cabecera premium */
    .header {
      text-align: center;
      margin-bottom: clamp(24px, 6vh, 38px);
    }

    .avatar {
      width: clamp(85px, 22vw, 115px);
      height: clamp(85px, 22vw, 115px);
      margin: 0 auto clamp(12px, 3vh, 18px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255,80,40,0.9);
      box-shadow: 0 0 40px rgba(255,50,20,0.7), 0 0 15px rgba(255,100,0,0.6);
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      background: #1a1a1a;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.4s ease, transform 0.3s ease;
    }

    .avatar:hover {
      box-shadow: 0 0 65px rgba(255,70,30,1);
      border-color: #ff8855;
      transform: scale(1.02);
    }

    .avatar:hover img {
      transform: scale(1.02);
    }

    h1 {
      font-size: clamp(1.8rem, 9vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
      text-shadow: 0 0 25px rgba(255,80,40,0.8);
      background: linear-gradient(135deg, #fff4e0, #ffc0a0, #ff9966);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      color: #ffe0cc;
      font-size: clamp(0.65rem, 3.5vw, 0.75rem);
      font-weight: 600;
      letter-spacing: clamp(2px, 1.2vw, 4px);
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(255,60,0,0.5);
    }

    /* Lista de enlaces premium con acento rojo */
    .links {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.5vh, 16px);
      margin-bottom: clamp(24px, 6vh, 32px);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30,10,5,0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,100,60,0.4);
      border-radius: 60px;
      padding: clamp(10px, 2.5vw, 14px) clamp(18px, 4vw, 26px);
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: clamp(0.8rem, 3.5vw, 0.95rem);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,120,70,0.25), transparent);
      transition: left 0.55s ease;
    }

    .link-btn:hover::before {
      left: 100%;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: clamp(10px, 3vw, 16px);
    }

    .link-left i {
      font-size: clamp(1rem, 4vw, 1.3rem);
      width: clamp(24px, 6vw, 30px);
      text-align: center;
      transition: all 0.3s ease;
    }

    .arrow {
      font-size: clamp(0.65rem, 2.5vw, 0.75rem);
      color: #ffaa88;
      transition: transform 0.3s ease, color 0.2s;
    }

    .link-btn:hover {
      background: rgba(60,20,15,0.9);
      border-color: rgba(255,100,60,0.9);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 25px rgba(255,70,30,0.4);
    }

    .link-btn:hover .arrow {
      transform: translateX(6px);
      color: #ffccaa;
    }

    /* Colores específicos para streaming con estilo rojo/fuego */
    .spotify-link i {
      color: #1DB954;
    }
    .spotify-link:hover i {
      text-shadow: 0 0 12px #1DB954;
    }
    .apple-link i {
      color: #fa6bcb;
    }
    .apple-link:hover i {
      text-shadow: 0 0 10px #ff6bcb;
    }
    .amazon-link i {
      color: #ff9900;
    }
    .amazon-link:hover i {
      text-shadow: 0 0 10px #ffbb44;
    }
    .deezer-link i {
      color: #A238FF;
    }
    .deezer-link:hover i {
      text-shadow: 0 0 12px #b85cff;
    }
    
    /* Botón destacado (estilo principal) */
    .link-btn--featured {
      background: #cc3300;
      border: none;
      color: #ffffff;
      box-shadow: 0 0 35px rgba(255,70,0,0.7);
    }
    
    .link-btn--featured .link-left i,
    .link-btn--featured span,
    .link-btn--featured .arrow {
      color: #ffffff;
    }

    .link-btn--featured:hover {
      background: #e34410;
      transform: translateY(-3px);
      box-shadow: 0 0 55px rgba(255,100,30,0.9);
    }
    
    /* Social dock rojo elegante */
    .social-dock {
      display: flex;
      justify-content: center;
      gap: clamp(20px, 6vw, 32px);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,100,70,0.45);
      border-radius: 80px;
      padding: clamp(8px, 2vh, 12px) clamp(20px, 5vw, 32px);
      width: fit-content;
      margin: 0 auto clamp(16px, 4vh, 24px);
      box-shadow: 0 0 35px rgba(255,60,20,0.3);
      transition: all 0.3s ease;
    }

    .social-dock:hover {
      border-color: rgba(255,120,80,0.7);
      box-shadow: 0 0 45px rgba(255,70,30,0.5);
    }

    .social-icon {
      color: #ffccaa !important;
      font-size: clamp(1rem, 4.5vw, 1.3rem);
      text-decoration: none;
      transition: all 0.3s ease;
      opacity: 0.9;
      position: relative;
    }

    .social-icon:hover {
      opacity: 1;
      transform: translateY(-4px) scale(1.1);
      color: #ffffff !important;
      text-shadow: 0 0 15px rgba(255,100,50,0.9);
    }

    /* Tooltip */
    .social-icon::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      color: #ffccaa;
      font-size: 0.6rem;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      pointer-events: none;
      font-weight: 500;
      border: 1px solid rgba(255,80,50,0.5);
    }

    .social-icon:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer premium */
    .footer {
      text-align: center;
      font-size: clamp(0.55rem, 3vw, 0.7rem);
      color: #ffb48a;
      letter-spacing: 0.4px;
      padding-top: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .footer a {
      color: #ffbe95;
      text-decoration: none;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .footer a:hover {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,80,40,0.7);
    }

    /* Animación de entrada con efecto llamarada */
    @keyframes flameRise {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .animate {
      animation: flameRise 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
      opacity: 0;
    }

    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.19s; }
    .d4 { animation-delay: 0.26s; }
    .d5 { animation-delay: 0.33s; }
    .d6 { animation-delay: 0.40s; }
    .d7 { animation-delay: 0.47s; }

    @media (max-width: 380px) {
      .link-left { gap: 8px; }
      .footer { flex-direction: column; gap: 6px; }
      .divider-dot { display: none; }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      body { padding: 12px 20px; }
      .header { margin-bottom: 12px; }
      .avatar { width: 55px; height: 55px; margin-bottom: 6px; }
      h1 { font-size: 1.3rem; }
      .links { gap: 8px; margin-bottom: 12px; }
      .link-btn { padding: 6px 14px; }
      .social-dock { padding: 5px 18px; }
    }
  </style>
</head>
<body>

<!-- FONDO ROJO DINÁMICO + ANIMACIÓN LLAMAS -->
<div class="red-aura"></div>
<div class="flame-overlay"></div>
<div class="energy-lines">
  <span></span><span></span><span></span><span></span><span></span>
</div>
<div class="red-noise"></div>

<div class="hub">
  
  <!-- Cabecera -->
  <div class="header animate d1">
    <div class="avatar" onclick="window.open('https://open.spotify.com/intl-es/artist/42euHjlNEF6gE3zuWrAJBi', '_blank')">
      <!-- Avatar con inicial I para Incrife, imagen placeholder pero con estilo -->
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23cc3300'/%3E%3Ctext x='100' y='135' font-size='110' text-anchor='middle' fill='white' font-weight='bold' font-family='Arial'%3EI%3C/text%3E%3C/svg%3E" alt="Incrife">
    </div>
    <h1>INCRIFE</h1>

  <!-- Enlaces principales / plataformas musicales ACTUALIZADOS para @incrife -->

    <a href="https://music.amazon.in/artists/B0FX5XCGKP" class="link-btn amazon-link animate d5" target="_blank" rel="noopener noreferrer">

    <!-- Plataforma principal destacada (podría ser web o perfil oficial) -->
    <a href="https://open.spotify.com/intl-es/artist/42euHjlNEF6gE3zuWrAJBi" class="link-btn link-btn--featured animate d6" target="_blank" rel="noopener noreferrer">
      <div class="link-left">

  <!-- Social Dock con tooltips (contacto y redes) -->
  <div class="social-dock animate d5">

      <i class="fa-brands fa-instagram"></i>

      <i class="fa-regular fa-envelope"></i>

    <a href="#" id="whatsappBtn" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" data-tooltip="WhatsApp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
  </div>

  <!-- Footer con email y copia -->
  <div class="footer animate d7">
    <span class="footer-line">incrife.music@gmail.com</span>
    <span class="divider-dot">·</span>
    <a href="#" id="copyEmail">📋 Copiar email</a>
    <span class="divider-dot">·</span>
    <span>© 2026 INCRIFE</span>
  </div>
</div>

<script>
  // ========== PARTÍCULAS / SPLASH CON FUEGO SUAVE ==========
  (function() {
    // Creamos elemento splash personalizado con efecto rojo/negro
    const splashDiv = document.createElement('div');
    splashDiv.id = 'customSplash';
    splashDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:#5a0f0f; z-index:10000; display:flex; justify-content:center; align-items:center; transition:opacity 0.9s cubic-bezier(0.2,0.9,0.4,1), visibility 0.9s; pointer-events:none;';
    const splashInner = document.createElement('div');
    splashInner.style.cssText = 'width:min(220px,45vw); text-align:center; animation: flamePulse 1.1s infinite ease-in-out;';
    splashInner.innerHTML = `<i class="fa-solid fa-fire" style="font-size:70px; color:#ff884d; filter: drop-shadow(0 0 30px #ff4400);"></i><h2 style="color:white; margin-top:15px; letter-spacing:3px;">INCRIFE</h2><p style="color:#ffaa77;">enciende la música</p>`;
    const styleAnim = document.createElement('style');
    styleAnim.textContent = `@keyframes flamePulse { 0% { transform: scale(0.92); opacity:0.9; text-shadow:0 0 0px #ff5500; } 100% { transform: scale(1.1); opacity:1; text-shadow:0 0 30px #ff6633; } }`;
    document.head.appendChild(styleAnim);
    splashDiv.appendChild(splashInner);
    document.body.appendChild(splashDiv);
    
    setTimeout(() => {
      splashDiv.style.opacity = '0';
      splashDiv.style.visibility = 'hidden';
      setTimeout(() => {
        if (splashDiv && splashDiv.remove) splashDiv.remove();
      }, 900);
    }, 2100);
  })();

  // ========== EMAIL CON GMAIL ==========
  const gmailBtn = document.getElementById('gmailBtn');
  if (gmailBtn) {
    const email = 'incrife.music@gmail.com';
    const subject = encodeURIComponent('Contacto / Colaboración · Incrife');
    const body = encodeURIComponent('Hola Incrife,%0D%0A%0D%0AMe interesa mucho tu propuesta musical. Me gustaría saber más sobre tus proyectos, lanzamientos o disponibilidad. %0D%0A%0D%0A¡Espero tu respuesta! 🔥');
    gmailBtn.href = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;
  }

  // ========== WHATSAPP (número de ejemplo, cámbialo según necesites) ==========
  const whatsappBtn = document.getElementById('whatsappBtn');
  if (whatsappBtn) {
    const phoneNumber = '34671122334';  // número placeholder para incrife, se puede modificar
    const message = encodeURIComponent('Hola Incrife! 🎵 Me encanta tu música, quiero contactar contigo para colaboración o booking.');
    whatsappBtn.href = `https://wa.me/${phoneNumber}?text=${message}`;
  }

  // ========== COPIAR EMAIL ==========
  const copyEmailEl = document.getElementById('copyEmail');
  if (copyEmailEl) {
    copyEmailEl.addEventListener('click', (e) => {
      e.preventDefault();
      const email = 'incrife.music@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        const originalText = copyEmailEl.innerText;
        copyEmailEl.innerText = '✅ ¡Copiado!';
        copyEmailEl.style.color = '#ffaa88';
        setTimeout(() => {
          copyEmailEl.innerText = originalText;
          copyEmailEl.style.color = '';
        }, 2000);
      }).catch(() => {
        alert('Copia manual: ' + email);
      });
    });
  }

  // ========== EFECTO DE LUZ EN BOTONES (posición dinámica) ==========
  document.querySelectorAll('.link-btn').forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      btn.style.setProperty('--x', `${x}%`);
      btn.style.setProperty('--y', `${y}%`);
    });
  });

  // Interacción táctil suave para móviles
  const socialIcons = document.querySelectorAll('.social-icon');
  socialIcons.forEach(icon => {
    icon.addEventListener('touchstart', () => {
      icon.style.transform = 'scale(0.94)';
      setTimeout(() => icon.style.transform = '', 130);
    });
  });
</script>

</body>
</html>
