<!-- ============================================================
     HERO ESTILO DADDY YANKEE - INCRIFE
     Reemplaza la sección <section class="hero" id="home"> actual
============================================================ -->
<section class="hero-dy" id="home">
    <!-- Capa de fondo con gradiente y textura -->
    <div class="hero-dy__bg"></div>
    <div class="hero-dy__grid"></div>

    <!-- Nombre gigante detrás de la foto (como en DY) -->
    <div class="hero-dy__title-bg">
        <h1 class="hero-dy__title">INCRIFE</h1>
    </div>

    <!-- Foto cutout con parallax -->
    <div class="hero-dy__image-wrap">
        <img 
            src="https://raw.githubusercontent.com/incrife/incrife/main/Retrato%20aislado%20con%20durag%20y%20cadenas%20de%20plata.png" 
            alt="Incrife - Retrato oficial con durag y cadenas de plata" 
            class="hero-dy__image"
            id="heroImage"
        >
    </div>

    <!-- Contenido textual y CTAs -->
    <div class="hero-dy__content">
        <p class="hero-dy__date">Artista Oficial · Barcelona</p>
        <h2 class="hero-dy__name">INCRIFE</h2>
        <p class="hero-dy__tagline">LUCKY · Disponible en VEVO y Apple Music</p>
        <div class="hero-dy__actions">
            <a href="#video" class="btn btn-primary btn-lg">Ver Videoclip</a>
            <a href="#about" class="btn btn-outline btn-lg">Conocer más</a>
        </div>
    </div>

    <!-- Indicador de scroll -->
    <div class="hero-dy__scroll">
        <span>DESPLAZAR</span>
        <i class="fas fa-chevron-down"></i>
    </div>
</section>

<!-- ===== PRELOADER (Carga inicial) ===== -->
<div id="preloader" class="preloader">
    <div class="preloader__inner">
        <div class="preloader__counter" id="preloaderCounter">0</div>
        <div class="preloader__line"></div>
        <p class="preloader__text">INCRIFE</p>
    </div>
</div>

<!-- ===== BOTÓN DE SONIDO (Música ambiente) ===== -->
<button id="soundToggle" class="sound-toggle" aria-label="Activar sonido">
    <i class="fas fa-volume-mute"></i>
</button>

<!-- ===== CURSOR PERSONALIZADO ===== -->
<div id="cursor" class="cursor"></div>
<div id="cursorFollower" class="cursor-follower"></div>

<!-- ============================================================
     ESTILOS PARA EL HERO, PRELOADER, SONIDO Y CURSOR
============================================================ -->
<style>
/* --- HERO DY --- */
.hero-dy {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #050505;
    isolation: isolate;
}
.hero-dy__bg {
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(ellipse at 50% 40%, rgba(180, 180, 180, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse at 20% 80%, rgba(100, 100, 100, 0.04) 0%, transparent 60%);
    z-index: 0;
}
.hero-dy__grid {
    position: absolute;
    inset: 0;
    opacity: 0.02;
    background-image:
        linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
}
.hero-dy__title-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
    width: 100%;
    text-align: center;
}
.hero-dy__title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(6rem, 20vw, 18rem);
    font-weight: 900;
    color: rgba(255, 255, 255, 0.03);
    letter-spacing: 0.1em;
    line-height: 0.8;
    margin: 0;
    white-space: nowrap;
}
.hero-dy__image-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    pointer-events: none;
    will-change: transform;
}
.hero-dy__image {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.6));
}
.hero-dy__content {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    text-align: center;
    width: 90%;
    max-width: 600px;
    pointer-events: auto;
}
.hero-dy__date {
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #aaaaaa;
    margin-bottom: 1rem;
}
.hero-dy__name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    margin-bottom: 0.5rem;
    letter-spacing: 0.02em;
}
.hero-dy__tagline {
    font-size: 0.9rem;
    color: #888;
    font-weight: 300;
    margin-bottom: 1.5rem;
}
.hero-dy__actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}
.hero-dy__scroll {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #555;
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    animation: bounce 2s infinite;
}

/* --- PRELOADER --- */
.preloader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}
.preloader.hidden {
    opacity: 0;
    visibility: hidden;
}
.preloader__inner {
    text-align: center;
}
.preloader__counter {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
}
.preloader__line {
    width: 100px;
    height: 2px;
    background: #333;
    margin: 1rem auto;
    position: relative;
    overflow: hidden;
}
.preloader__line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #ffffff;
    transform: scaleX(0);
    transform-origin: left;
    animation: preloaderLine 2s ease forwards;
}
.preloader__text {
    font-size: 0.7rem;
    letter-spacing: 6px;
    color: #aaaaaa;
    text-transform: uppercase;
}
@keyframes preloaderLine {
    to { transform: scaleX(1); }
}

/* --- BOTÓN DE SONIDO --- */
.sound-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #aaaaaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.3s ease;
}
.sound-toggle:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    transform: scale(1.05);
}

/* --- CURSOR PERSONALIZADO --- */
.cursor, .cursor-follower {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 99998;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s ease;
    opacity: 0;
}
.cursor {
    width: 8px;
    height: 8px;
    background: #ffffff;
}
.cursor-follower {
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.1s ease, opacity 0.3s ease;
}
body:hover .cursor, body:hover .cursor-follower {
    opacity: 1;
}

@media (max-width: 768px) {
    .hero-dy__image-wrap { max-width: 350px; }
    .hero-dy__title { font-size: 5rem; }
    .hero-dy__content { bottom: 8%; }
    .cursor, .cursor-follower { display: none; } /* Ocultar en móvil */
    .sound-toggle { bottom: 20px; right: 20px; width: 40px; height: 40px; }
}
</style>

<!-- ============================================================
     JAVASCRIPT PARA ANIMACIONES
============================================================ -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // --- 1. PRELOADER ---
    const preloader = document.getElementById('preloader');
    const counter = document.getElementById('preloaderCounter');
    if (preloader && counter) {
        let count = 0;
        const interval = setInterval(() => {
            count += Math.floor(Math.random() * 10) + 1;
            if (count >= 100) {
                count = 100;
                clearInterval(interval);
                setTimeout(() => {
                    preloader.classList.add('hidden');
                }, 500);
            }
            counter.textContent = count;
        }, 30);
    }

    // --- 2. PARALLAX SUAVE EN LA FOTO DEL HERO ---
    const heroImage = document.getElementById('heroImage');
    if (heroImage) {
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            heroImage.style.transform = `translate(${x}px, ${y}px)`;
        });
    }

    // --- 3. BOTÓN DE SONIDO (Música ambiente) ---
    const soundToggle = document.getElementById('soundToggle');
    if (soundToggle) {
        let isPlaying = false;
        // Puedes añadir una URL de audio real aquí si tienes un loop.
        // const audio = new Audio('tu-loop.mp3');
        soundToggle.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = soundToggle.querySelector('i');
            if (isPlaying) {
                // audio.play();
                icon.classList.remove('fa-volume-mute');
                icon.classList.add('fa-volume-up');
                soundToggle.setAttribute('aria-label', 'Desactivar sonido');
            } else {
                // audio.pause();
                icon.classList.remove('fa-volume-up');
                icon.classList.add('fa-volume-mute');
                soundToggle.setAttribute('aria-label', 'Activar sonido');
            }
        });
    }

    // --- 4. CURSOR PERSONALIZADO ---
    const cursor = document.getElementById('cursor');
    const follower = document.getElementById('cursorFollower');
    if (cursor && follower) {
        let mouseX = 0, mouseY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        });

        // Animación suave para el follower
        function animateFollower() {
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;
            follower.style.transform = `translate(${followerX}px, ${followerY}px)`;
            requestAnimationFrame(animateFollower);
        }
        animateFollower();
    }
});
</script>
