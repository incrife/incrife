<!-- ============================================================
     ESTILOS — Técnicas reales de DY
============================================================ -->
<style>
/* ===== PRELOADER (DY pattern) ===== */
.dy-preloader {
    position: fixed; inset: 0; z-index: 99999;
    background: #050505;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1s ease, visibility 1s ease;
}
.dy-preloader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.dy-preloader__inner { text-align: center; }
.dy-preloader__counter {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 800; color: #fff; line-height: 1;
}
.dy-preloader__line {
    width: 120px; height: 2px; background: #222;
    margin: 1rem auto; overflow: hidden;
}
.dy-preloader__line span {
    display: block; height: 100%; background: #fff;
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.1s linear;
}
.dy-preloader__label {
    font-size: 0.65rem; letter-spacing: 6px;
    color: #666; text-transform: uppercase; margin-top: 1rem;
}

/* ===== NAV (DY pattern con clip-path) ===== */
.dy-nav {
    position: fixed; inset: 0; z-index: 9998;
    pointer-events: none;
}
.dy-nav__bar {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5rem 2rem; z-index: 2;
    pointer-events: auto;
    transition: color 0.4s ease;
}
.dy-nav__logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 800;
    color: #fff; letter-spacing: 3px; text-decoration: none;
}
.dy-nav__bar-right { display: flex; align-items: center; gap: 1rem; }
.dy-nav__sound {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
}
.dy-nav__sound:hover { background: rgba(255,255,255,0.12); color: #fff; }
.dy-nav__toggle {
    background: transparent; border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem; letter-spacing: 2px;
    color: #fff; cursor: pointer;
    position: relative; overflow: hidden;
    padding: 0.4rem 0;
}
.dy-nav__toggle-open, .dy-nav__toggle-close {
    display: block; transition: transform 0.4s ease;
}
.dy-nav__toggle-close { position: absolute; top: 0.4rem; left: 0; transform: translateY(100%); }
[data-nav-status="open"] .dy-nav__toggle-open { transform: translateY(-100%); }
[data-nav-status="open"] .dy-nav__toggle-close { transform: translateY(0); }

/* Tile con clip-path (EXACTO de DY) */
.dy-nav__tile {
    position: fixed; inset: 0;
    background: #0a0a0a;
    clip-path: polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%);
    transition: clip-path 1s cubic-bezier(0.9, 0, 0.1, 1);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
}
[data-nav-status="open"] .dy-nav__tile {
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    pointer-events: auto;
}
.dy-nav__tile-inner {
    display: flex; flex-direction: column; gap: 2rem;
    align-items: center; text-align: center;
}
.dy-nav__links { list-style: none; padding: 0; margin: 0; }
.dy-nav__links li { overflow: hidden; margin: 0.3rem 0; }
.dy-nav__links li a {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 800;
    color: #fff; text-decoration: none;
    letter-spacing: 0.02em;
    transform: translateY(100%) rotate(5deg);
    transition: transform 0.75s cubic-bezier(0.7, 0, 0.3, 1);
}
[data-nav-status="open"] .dy-nav__links li a {
    transform: translateY(0%) rotate(0deg);
}
/* Stagger delays EXACTOS de DY */
[data-nav-status="open"] .dy-nav__links li:nth-child(1) a { transition-delay: 0.30s; }
[data-nav-status="open"] .dy-nav__links li:nth-child(2) a { transition-delay: 0.35s; }
[data-nav-status="open"] .dy-nav__links li:nth-child(3) a { transition-delay: 0.40s; }
[data-nav-status="open"] .dy-nav__links li:nth-child(4) a { transition-delay: 0.45s; }
[data-nav-status="open"] .dy-nav__links li:nth-child(5) a { transition-delay: 0.50s; }

.dy-nav__socials { display: flex; gap: 1.5rem; margin-top: 2rem; }
.dy-nav__socials a {
    color: #666; text-decoration: none;
    font-size: 0.72rem; letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s ease;
}
.dy-nav__socials a:hover { color: #fff; }

/* ===== HERO con shutters (DY portrait pattern) ===== */
.dy-hero {
    position: relative; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #050505;
}
.dy-hero__bg-title {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1; pointer-events: none;
}
.dy-split { margin: 0; padding: 0; overflow: hidden; }
.dy-split__mask {
    display: block; overflow: hidden; line-height: 0.85;
}
.dy-split__line {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(6rem, 22vw, 22rem);
    font-weight: 900;
    color: rgba(255,255,255,0.04);
    letter-spacing: 0.05em;
    transform: translateY(100%);
    transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.2s;
}
.dy-hero.is-loaded .dy-split__line { transform: translateY(0); }

.dy-hero__media {
    position: relative; z-index: 2;
    width: 100%; max-width: 520px;
    aspect-ratio: 3/4;
}
.dy-hero__img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 30px 80px rgba(0,0,0,0.7));
    opacity: 0; transition: opacity 0.6s ease 1s;
}
.dy-hero.is-loaded .dy-hero__img { opacity: 1; }

/* Shutters EXACTOS: 4 persianas que se retiran */
.dy-hero__shutters {
    position: absolute; inset: 0; z-index: 3;
    pointer-events: none;
}
.dy-shutter {
    position: absolute; background: #0a0a0a;
    transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
}
.dy-shutter--top    { top: 0; left: 0; right: 0; height: 50%; transform-origin: top; }
.dy-shutter--bottom { bottom: 0; left: 0; right: 0; height: 50%; transform-origin: bottom; }
.dy-shutter--left   { top: 0; left: 0; bottom: 0; width: 50%; transform-origin: left; }
.dy-shutter--right  { top: 0; right: 0; bottom: 0; width: 50%; transform-origin: right; }

.dy-hero.is-loaded .dy-shutter--top    { transform: translateY(-100%); }
.dy-hero.is-loaded .dy-shutter--bottom { transform: translateY(100%); }
.dy-hero.is-loaded .dy-shutter--left   { transform: translateX(-100%); }
.dy-hero.is-loaded .dy-shutter--right  { transform: translateX(100%); }

.dy-hero__content {
    position: absolute; bottom: 10%; left: 50%;
    transform: translateX(-50%);
    z-index: 4; text-align: center;
    width: 90%; max-width: 600px;
    opacity: 0; transition: opacity 0.8s ease 1.4s;
}
.dy-hero.is-loaded .dy-hero__content { opacity: 1; }
.dy-hero__date {
    font-size: 0.7rem; letter-spacing: 4px;
    text-transform: uppercase; color: #aaa;
    margin-bottom: 0.6rem;
}
.dy-hero__tagline {
    font-size: 0.9rem; color: #888;
    font-weight: 300; margin-bottom: 1.5rem;
}
.dy-hero__ctas {
    display: flex; gap: 1rem;
    justify-content: center; flex-wrap: wrap;
}

/* ===== BOTONES CON LÍNEAS (EXACTO de DY) ===== */
.dy-btn {
    display: inline-flex; align-items: center; gap: 0.8rem;
    padding: 0.9rem 1.6rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none;
    color: #fff;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.3s ease;
    position: relative;
}
.dy-btn__line {
    display: inline-block;
    width: 24px; height: 1px;
    background: currentColor;
    transition: transform 0.4s cubic-bezier(0.7, 0, 0.3, 1);
}
.dy-btn:hover .dy-btn__line { transform: scaleX(0.6); }
.dy-btn:hover { color: #ccc; }
.dy-btn--primary { background: rgba(255,255,255,0.08); }
.dy-btn--primary:hover { background: rgba(255,255,255,0.14); }

.dy-hero__scroll {
    position: absolute; bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    font-size: 0.6rem; letter-spacing: 3px;
    text-transform: uppercase; color: #555;
    opacity: 0; transition: opacity 0.8s ease 1.8s;
}
.dy-hero.is-loaded .dy-hero__scroll { opacity: 1; }

/* Responsive */
@media (max-width: 768px) {
    .dy-hero__media { max-width: 340px; }
    .dy-nav__bar { padding: 1rem 1.2rem; }
    .dy-hero__content { bottom: 8%; }
    .dy-nav__links li a { font-size: 1.8rem; }
}
</style>

<!-- ============================================================
     JAVASCRIPT — Control de preloader, nav, sonido, shutters
============================================================ -->
<script>
document.addEventListener('DOMContentLoaded', function() {

    /* ---------- 1. PRELOADER con sessionStorage (código real de DY) ---------- */
    const preloader = document.getElementById('dyPreloader');
    const counter   = document.getElementById('dyCounter');
    const lineFill  = preloader ? preloader.querySelector('.dy-preloader__line span') : null;
    const hero      = document.querySelector('.dy-hero');

    let entered = false;
    try { entered = sessionStorage.getItem('incrife-entered') === '1'; } catch(e) {}

    if (entered) {
        // Ya entró antes en esta sesión: saltar preloader
        if (preloader) preloader.classList.add('is-hidden');
        if (hero) hero.classList.add('is-loaded');
    } else {
        // Primera vez: animar contador 0→100
        let count = 0;
        const iv = setInterval(() => {
            count = Math.min(100, count + Math.floor(Math.random() * 8) + 2);
            if (counter) counter.textContent = count;
            if (lineFill) lineFill.style.transform = `scaleX(${count/100})`;
            if (count >= 100) {
                clearInterval(iv);
                setTimeout(() => {
                    preloader.classList.add('is-hidden');
                    hero.classList.add('is-loaded');
                    try { sessionStorage.setItem('incrife-entered', '1'); } catch(e) {}
                }, 400);
            }
        }, 40);
    }

    /* ---------- 2. NAV full-screen con clip-path (DY pattern) ---------- */
    const nav    = document.getElementById('dyNav');
    const toggle = document.getElementById('dyToggle');
    const tile   = document.getElementById('dyTile');
    if (toggle && nav) {
        toggle.addEventListener('click', () => {
            const isOpen = nav.getAttribute('data-nav-status') === 'open';
            nav.setAttribute('data-nav-status', isOpen ? 'closed' : 'open');
            document.body.style.overflow = isOpen ? '' : 'hidden';
        });
    }
    // Cerrar al hacer clic en un link
    document.querySelectorAll('.dy-nav__links a').forEach(a => {
        a.addEventListener('click', () => {
            nav.setAttribute('data-nav-status', 'closed');
            document.body.style.overflow = '';
        });
    });
    // Cerrar con ESC
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && nav && nav.getAttribute('data-nav-status') === 'open') {
            nav.setAttribute('data-nav-status', 'closed');
            document.body.style.overflow = '';
        }
    });

    /* ---------- 3. BOTÓN DE SONIDO (DY pattern con audio) ---------- */
    const soundBtn = document.getElementById('dySound');
    // Sustituye esta URL por un MP3 tuyo (loop de 10-30s)
    const audio = new Audio(''); // <-- aquí tu MP3
    audio.loop = true;
    audio.volume = 0.4;
    let isPlaying = false;
    if (soundBtn) {
        soundBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                audio.play().catch(() => {});
                soundBtn.style.color = '#fff';
                soundBtn.style.background = 'rgba(255,255,255,0.14)';
            } else {
                audio.pause();
                soundBtn.style.color = '#ccc';
                soundBtn.style.background = 'rgba(255,255,255,0.06)';
            }
        });
    }

    /* ---------- 4. SKETCH HOVER (aplicar a los botones, filtro SVG real de DY) ---------- */
    document.querySelectorAll('.dy-btn').forEach(btn => {
        btn.style.filter = 'url(#sketch-hover-0)';
    });

});
</script>
